name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Build, test, fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # freeze guard needs the pinned commit in history

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build (locked dependencies)
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Benchmark smoke (bench builds and runs, 2 iters)
        run: make bench-smoke

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Supply chain (advisories, bans, licenses, sources)
        run: cargo deny check
      # NOTE: no separate audit-check step — `cargo deny check` above already
      # gates advisories (deny.toml [advisories], yanked=deny). A second
      # RustSec scan would be redundant signal with its own cache-staleness
      # failure mode; one gate owns supply-chain verdicts.

      - name: Requirement traceability
        run: make trace

      - name: Core neutrality gate (PE-NEUT-001/004)
        run: make neutrality

      - name: No-panic gate (PE-SEC-004)
        run: make no-panic

      - name: Web demo honesty gate (embedded data == fresh CLI output)
        run: make web-check

      - name: CDDL golden-vector validation
        run: make cddl-validate

      - name: Freeze guard (frozen core untouched since pin)
        run: make freeze-guard

      - name: SBOM determinism (same lockfile, byte-identical SBOM)
        run: |
          python3 tools/gen_sbom.py --out /tmp/sbom-a.json
          python3 tools/gen_sbom.py --out /tmp/sbom-b.json
          cmp /tmp/sbom-a.json /tmp/sbom-b.json

# PE-NEUT-003: the core must carry unrelated industries without
# modification. The domain suite builds against the core as a pure external
# consumer (not a workspace member) — exactly like a third-party application.
  domains:
    name: Domain differential suite (neutrality proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            domains/proof-domains

      - name: Domain journeys (12 industries, same core)
        run: make domain-tests

      - name: Neutrality gate (no domain vocabulary in mechanism sources)
        run: make neutrality

# Perf regression tripwire (release profile vs committed baseline).
# 100% tolerance + 0.05 ms noise floor: catches 2x-class slowdowns without
# flaking on timer jitter or runner differences (baseline: slow ARM box, so
# faster runners pass with headroom).
  perf:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Perf gate (release, 20 iters, committed baseline)
        run: make bench-check

# PE-OPS-004: demo determinism enforced (sha256 rerun).
  demo:
    name: Demo is deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: make demo (PASS -> tamper -> FAIL -> revoke -> FAIL)
        run: make demo

      - name: Required artifacts exist
        run: |
          test -f demo/out/proof.cbor
          test -f demo/out/report.json
          test -f demo/out/explanation.txt

      - name: Rerun must reproduce every byte
        run: |
          sha256sum demo/out/proof.cbor demo/out/report.json demo/out/explanation.txt > /tmp/first.sha
          make demo
          sha256sum -c /tmp/first.sha

      - name: Upload demo evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: demo-evidence
          path: demo/out/
