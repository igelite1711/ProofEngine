[package]
name = "proof-policy"
version = "1.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Policy schema, validator, and deterministic evaluator for Proof Engine"
repository = "https://github.com/igelite1711/ProofEngine"
homepage = "https://github.com/igelite1711/ProofEngine"
documentation = "https://docs.rs/proof-policy"
keywords = ["proof", "policy", "trust", "verification"]
categories = ["cryptography"]

[dependencies]
proof-core = { version = "1.0.0", path = "../proof-core" }
proof-format = { version = "1.0.0", path = "../proof-format" }
proof-crypto = { version = "1.0.0", path = "../proof-crypto" }
proof-verify = { version = "1.0.0", path = "../proof-verify" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proof-crypto = { version = "1.0.0", path = "../proof-crypto" }
proof-format = { version = "1.0.0", path = "../proof-format" }
hex = { workspace = true }
