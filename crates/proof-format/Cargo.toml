[package]
name = "proof-format"
version = "1.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Canonical CBOR encode/decode, schema validation, and versioned parsers for Proof Engine"
repository = "https://github.com/igelite1711/ProofEngine"
homepage = "https://github.com/igelite1711/ProofEngine"
documentation = "https://docs.rs/proof-format"
keywords = ["proof", "cbor", "canonical", "encoding", "serialization"]
categories = ["encoding", "cryptography"]

[dependencies]
proof-core = { version = "1.0.0", path = "../proof-core" }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
