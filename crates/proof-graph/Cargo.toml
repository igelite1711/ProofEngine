[package]
name = "proof-graph"
version = "1.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Typed DAG validation, cycle/depth checks for Proof Engine relationship graphs"
repository = "https://github.com/igelite1711/ProofEngine"
homepage = "https://github.com/igelite1711/ProofEngine"
documentation = "https://docs.rs/proof-graph"
keywords = ["proof", "graph", "dag", "validation"]
categories = ["data-structures"]

[dependencies]
proof-core = { version = "1.0.0", path = "../proof-core" }
thiserror = { workspace = true }

[dev-dependencies]
proof-crypto = { version = "1.0.0", path = "../proof-crypto" }
proof-format = { version = "1.0.0", path = "../proof-format" }
hex = { workspace = true }
serde_json = { workspace = true }
