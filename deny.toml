# cargo-deny configuration (V0.1 acceptance A12 support).
# Gates: known advisories, copyleft/unknown licenses, crates.io-only sources.
# PE-OPS-002 (supply chain) · PE-OPS-005 (no forbidden families).
# Run: `cargo deny check` (also enforced in .github/workflows/ci.yml).
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
# Dual MIT/Apache-2.0 project: allow those plus common permissives found in
# the Rust crypto/serde stack. Copyleft and unknown licenses are denied.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
